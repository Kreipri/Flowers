    // Web Audio API Synthesizer (Zero external audio file dependencies)
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmPlaying = false;
        this.bgmTimer = null;
      }

      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Pop / Chime sound for positive catches (sweet pentatonic notes)
      playCatch(combo = 1) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
        const noteIndex = Math.min(scale.length - 1, (combo - 1) % scale.length);
        const freq = scale[noteIndex];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.05, now + 0.15);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, now);
        gain2.gain.setValueAtTime(0.12, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.25);
      }

      // Warning tone when colliding with a hazard
      playHurt() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }

      // Envelope opening flutter sound
      playEnvelopeOpen() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.45);
        });
      }

      // A short falling chime for either defeat. This method must exist: a missing
      // end sound previously threw before the result callback could render the UI.
      playDefeat() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [330, 277, 220].forEach((frequency, index) => {
          const start = now + index * .14;
          const oscillator = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(.12, start);
          gain.gain.exponentialRampToValueAtTime(.001, start + .35);
          oscillator.connect(gain);
          gain.connect(this.ctx.destination);
          oscillator.start(start);
          oscillator.stop(start + .36);
        });
      }

      // Uplifting victory harp
      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.1);
          gain.gain.setValueAtTime(0.2, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.1);
          osc.stop(now + i * 0.1 + 0.65);
        });
      }

      // Ambient gentle background lullaby arpeggio loop
      startBgm() {
        if (this.bgmPlaying || this.muted) return;
        this.bgmPlaying = true;
        this.init();

        const chords = [
          [392, 493.88, 587.33], // G major
          [440, 523.25, 659.25], // A minor
          [329.63, 392, 493.88], // E minor
          [349.23, 440, 523.25]  // F major
        ];
        let chordIdx = 0;

        const playChimeNote = () => {
          if (!this.bgmPlaying || this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          const currentChord = chords[chordIdx];
          const note = currentChord[Math.floor(Math.random() * currentChord.length)];

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note * (Math.random() > 0.5 ? 2 : 1), now);

          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 1.9);

          chordIdx = (chordIdx + 1) % chords.length;
          this.bgmTimer = setTimeout(playChimeNote, 1200 + Math.random() * 800);
        };

        playChimeNote();
      }

      stopBgm() {
        this.bgmPlaying = false;
        if (this.bgmTimer) clearTimeout(this.bgmTimer);
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
          this.stopBgm();
        } else {
          this.startBgm();
        }
        return this.muted;
      }
    }

    function OpenLetterModal({ onStartGame, onClose }) {
      const letterRef = useRef(null);
      useEffect(() => {
        const previousFocus = document.activeElement;
        letterRef.current?.focus();
        const handleKey = e => {
          if (e.key === 'Escape') onClose();
          if (e.key !== 'Tab') return;
          // Keep keyboard focus on the letter's two actions until it closes.
          const controls = letterRef.current.querySelectorAll('button');
          const first = controls[0], last = controls[controls.length - 1];
          if (e.shiftKey && (document.activeElement === first || document.activeElement === letterRef.current)) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', handleKey);
        return () => { document.removeEventListener('keydown', handleKey); previousFocus?.focus(); };
      }, [onClose]);
      const text = TEXT_CONTENT.letter;
      // Portal to body: fixed backdrop must never inherit the intro's overflow
      // clipping, isolation, or any animated bouquet transform.
      return ReactDOM.createPortal(<div className="letter-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
        <section ref={letterRef} tabIndex={-1} role="dialog" aria-modal="true" aria-labelledby="letter-title" className="designed-letter custom-scrollbar">

          <p className="letter-controls">{text.controls}</p>
          <p className="letter-signoff">{text.signoff}</p>
        </section>
      </div>, document.body);

      return ReactDOM.createPortal(<main className="result-screen">
        <section ref={cardRef} tabIndex={-1} role="dialog" aria-modal="true" className="result-card" data-status={status} aria-labelledby="result-title">
          <p className="eyebrow">{isWin ? text.winEyebrow : isMissedCatch ? text.missedEyebrow : text.loseEyebrow}</p>
          <svg className="result-art" viewBox="0 0 280 200" role="img" aria-label={isWin ? text.winArt : isMissedCatch ? text.missedArt : text.loseArt}>
            <ellipse cx="140" cy="104" rx="91" ry="83" fill={isWin ? '#f6e4df' : '#e9e9e3'} />
            {isWin ? <>
              <ellipse cx="140" cy="183" rx="72" ry="8" fill="#dec9c330" />
              {/* Separate, upright silhouettes: two happy people celebrating together. */}
              <Character x={94} y={116} size={.95} /><Character girl x={186} y={116} size={.95} />
              <g fill="#e2bd7c"><circle cx="56" cy="44" r="4" /><circle cx="226" cy="64" r="3" /></g>
              <path d="M77 32l4 9M214 35l-4 9" stroke="#b8c8a9" strokeWidth="4" strokeLinecap="round" />
              <Heart x={140} y={41} size={1.2} /><Heart x={67} y={79} size={.35} color="#e6bac1" /><Heart x={214} y={115} size={.4} color="#e6bac1" />
            </> : isMissedCatch ? <>
              <FallenGirl />
            </> : <>
              <g fill="#b6c3cf"><rect x="83" y="65" width="114" height="45" rx="23" /><circle cx="111" cy="65" r="24" /><circle cx="151" cy="56" r="31" /></g>
              <path d="M113 88q5-6 10 0M154 88q5-6 10 0" stroke="#8393a4" fill="none" strokeWidth="3" strokeLinecap="round" />
              <path d="M108 120l-4 10M140 119l-4 10M173 120l-4 10" stroke="#a8bfd0" strokeWidth="5" strokeLinecap="round" />
              <path d="M140 184Q148 155 127 151" fill="none" stroke="#9fb293" strokeWidth="6" strokeLinecap="round" /><g transform="translate(124 157) rotate(145)"><Flower size={.45} rose /></g>
            </>}
          </svg>
          <h1 id="result-title" role="status">{isWin ? text.winTitle : isMissedCatch ? text.missedTitle : text.loseTitle}</h1>
          <p className="result-copy">{isWin ? text.winCopy : isMissedCatch ? text.missedCopy : text.loseCopy}</p>
          {isNewBest && <span className="best-badge">{text.best}</span>}
          <div className="result-score"><small>{text.total}</small><strong>{finalScore}</strong><small>{formatText(text.streak, { level, combo: maxCombo })}</small></div>
          <div className="result-stats"><span>{formatText(text.flowers, { count: stats.sunflowers || 0 })}</span><span>{formatText(text.stars, { count: stats.stars || 0 })}</span><span>{formatText(text.hearts, { count: stats.hearts || 0 })}</span><span>{formatText(text.sparkles, { count: stats.sparkles || 0 })}</span></div>
          <button className="primary-button" onClick={onPlayAgain}>{formatText(text.playAgain, { level: level + 1 })} <span aria-hidden="true">{TEXT_CONTENT.symbols.arrow}</span></button>
          <button className="secondary-button" onClick={onBackToIntro}>{text.back}</button>
        </section>
      </main>, document.body);
    }



    function App() {
      // App owns the session across canvas remounts. Only the round's temporary
      // state (lives, timer, items, streak) belongs inside CatchingGame.
      // Store the view and its result payload together, so an end screen can
      // never render with a missing or stale result.
      const [screen, setScreen] = useState({ view: 'intro', result: null });
      const [soundMuted, setSoundMuted] = useState(false);
      const [session, setSession] = useState({ score: 0, level: 0 });
      const [gameKey, setGameKey] = useState(0);

      React.useEffect(() => { document.title = TEXT_CONTENT.appTitle; }, []);

      const handleToggleSound = () => {
        setSoundMuted(sound.toggleMute());
      };

      // Every new round advances the level, including a round started from the
      // letter after returning to the intro. Level 1 can therefore happen only once
      // in this session; refreshing the page begins a new session.
      const startRound = () => {
        sound.init();
        setSession(previous => ({ ...previous, level: previous.level + 1 }));
        setGameKey(key => key + 1);
        setScreen({ view: 'game', result: null });
      };

      const handleGameEnd = data => {
        // Preserve accumulated points on BOTH victory and defeat. The next round
        // earns another 500 points toward its own climax, rather than reusing the
        // accumulated total as an immediately satisfied win condition.
        setSession(previous => ({ ...previous, score: data.finalScore }));
        setScreen({ view: 'end', result: data });
      };

      const handleBackToIntro = snapshot => {
        // Leaving an unfinished round carries its earned points too. Result-screen
        // buttons supply no snapshot because handleGameEnd already saved the total.
        if (typeof snapshot?.score === 'number') {
          setSession(previous => ({ ...previous, score: snapshot.score }));
        }
        setScreen({ view: 'intro', result: null });
      };

      return <div className="app-shell">
        <style>{introStyles}</style>
        {screen.view === 'intro' && <IntroScreen onStartGame={startRound} soundMuted={soundMuted} onToggleSound={handleToggleSound} />}
        {screen.view !== 'intro' && <div inert={screen.view === 'end' ? '' : undefined} aria-hidden={screen.view === 'end' ? true : undefined}><CatchingGame key={gameKey} level={session.level} initialScore={session.score} onGameEnd={handleGameEnd} onBackToIntro={handleBackToIntro} soundMuted={soundMuted} onToggleSound={handleToggleSound} /></div>}
        {screen.view === 'end' && <GameOverModal {...screen.result} level={session.level} onPlayAgain={startRound} onBackToIntro={() => handleBackToIntro()} />}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
