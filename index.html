// Web Audio API Synthesizer (Zero external audio file dependencies)
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmPlaying = false;
    this.bgmTimer = null;
  }

  init() {
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Pop / Chime sound for positive catches (sweet pentatonic notes)
  playCatch(combo = 1) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
    const noteIndex = Math.min(scale.length - 1, (combo - 1) % scale.length);
    const freq = scale[noteIndex];

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.05, now + 0.15);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);

    const osc2 = this.ctx.createOscillator();
    const gain2 = this.ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, now);
    gain2.gain.setValueAtTime(0.12, now);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc2.connect(gain2);
    gain2.connect(this.ctx.destination);
    osc2.start(now);
    osc2.stop(now + 0.25);
  }

  // Warning tone when colliding with a hazard
  playHurt() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  // Envelope opening flutter sound
  playEnvelopeOpen() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0.15, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.45);
    });
  }

  // Uplifting victory harp
  playVictory() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    notes.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.1);
      gain.gain.setValueAtTime(0.2, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.6);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.1);
      osc.stop(now + i * 0.1 + 0.65);
    });
  }

  // Ambient gentle background lullaby arpeggio loop
  startBgm() {
    if (this.bgmPlaying || this.muted) return;
    this.bgmPlaying = true;
    this.init();

    const chords = [
      [392, 493.88, 587.33], // G major
      [440, 523.25, 659.25], // A minor
      [329.63, 392, 493.88], // E minor
      [349.23, 440, 523.25]  // F major
    ];
    let chordIdx = 0;

    const playChimeNote = () => {
      if (!this.bgmPlaying || this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const currentChord = chords[chordIdx];
      const note = currentChord[Math.floor(Math.random() * currentChord.length)];

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(note * (Math.random() > 0.5 ? 2 : 1), now);

      gain.gain.setValueAtTime(0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 1.9);

      chordIdx = (chordIdx + 1) % chords.length;
      this.bgmTimer = setTimeout(playChimeNote, 1200 + Math.random() * 800);
    };

    playChimeNote();
  }

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmTimer) clearTimeout(this.bgmTimer);
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) {
      this.stopBgm();
    } else {
      this.startBgm();
    }
    return this.muted;
  }
}

function OpenLetterModal({ onStartGame, onClose }) {
  const letterRef = useRef(null);
  useEffect(() => {
    const previousFocus = document.activeElement;
    letterRef.current?.focus();
    const handleKey = e => {
      if (e.key === 'Escape') onClose();
      if (e.key !== 'Tab') return;
      // Keep keyboard focus on the letter's two actions until it closes.
      const controls = letterRef.current.querySelectorAll('button');
      const first = controls[0], last = controls[controls.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === letterRef.current)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', handleKey);
    return () => { document.removeEventListener('keydown', handleKey); previousFocus?.focus(); };
  }, [onClose]);
  const text = TEXT_CONTENT.letter;
  return <div className="letter-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
    <section ref={letterRef} tabIndex={-1} role="dialog" aria-modal="true" aria-labelledby="letter-title" className="designed-letter custom-scrollbar">
      <button className="letter-close" onClick={onClose} aria-label={TEXT_CONTENT.controls.closeLetter}>{TEXT_CONTENT.symbols.close}</button>
      <svg className="letter-flower" viewBox="-50 -50 100 100" aria-hidden="true"><Flower size={.8}/></svg>
      <p className="eyebrow">{text.eyebrow}</p>
      <h2 id="letter-title">{text.greeting}</h2>
      {text.paragraphs.map((paragraph, index) => <p key={index}>{paragraph}</p>)}
      <p className="letter-script">{text.verse}</p>
      <p>{text.invitation}</p>
      <div className="letter-mission">{formatText(text.mission, { points: GAME_CONFIG.gameplay.roundTarget, seconds: GAME_CONFIG.gameplay.finaleSeconds })}<br/><span>{text.surprise}</span></div>
      <button onClick={onStartGame} className="primary-button">{text.play}<span aria-hidden="true">{TEXT_CONTENT.symbols.arrow}</span></button>
      <p className="letter-controls">{text.controls}</p>
      <p className="letter-signoff">{text.signoff}</p>
    </section>
  </div>;
}

// Intro state machine: tucked -> launching -> interactive -> opening -> opened.
// Closing the modal returns to interactive, without replaying the bouquet launch.
function IntroScreen({ onStartGame, soundMuted, onToggleSound }) {
  const [envelopeState, setEnvelopeState] = useState('tucked');
  const envelopeRef = useRef(null);
  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  useEffect(() => {
    if (envelopeState === 'interactive') envelopeRef.current?.focus({ preventScroll: true });
    // animationend drives normal transitions. Timers also recover if a browser
    // cancels an animation or reduced-motion settings change while it is running.
    if (!['launching', 'opening'].includes(envelopeState)) return;
    const next = envelopeState === 'launching' ? 'interactive' : 'opened';
    const duration = envelopeState === 'launching' ? GAME_CONFIG.intro.launchMs : GAME_CONFIG.intro.paperRevealMs;
    const timer = setTimeout(() => setEnvelopeState(next), reducedMotion() ? 0 : duration + 100);
    return () => clearTimeout(timer);
  }, [envelopeState]);
  const closeLetter = React.useCallback(() => setEnvelopeState('interactive'), []);
  const footer = TEXT_CONTENT.intro.footer[envelopeState];
  return <div className="intro-scene">
    <p className="intro-heading eyebrow">{TEXT_CONTENT.intro.eyebrow}</p>
    <button className="intro-sound icon-button" onClick={onToggleSound} aria-label={soundMuted ? TEXT_CONTENT.controls.unmute : TEXT_CONTENT.controls.mute}><Icon name={soundMuted ? 'muted' : 'sound'}/></button>
    <div className="intro-stack">
      <h1 className="intro-title">{TEXT_CONTENT.intro.title}</h1>
      <div className="bouquet-layer bouquet-back"><Bouquet/></div>
      <div className="envelope-track" data-state={envelopeState} style={{ '--paper-reveal': `${GAME_CONFIG.intro.paperRevealMs}ms`, animationDuration: envelopeState === 'launching' ? `${GAME_CONFIG.intro.launchMs}ms` : undefined }} onAnimationEnd={e => {
        if (envelopeState === 'launching' && e.animationName === 'envelope-emerge') setEnvelopeState('interactive');
        if (envelopeState === 'opening' && e.animationName === 'paper-reveal') setEnvelopeState('opened');
      }}>
        <button ref={envelopeRef} type="button" className={`soft-envelope ${envelopeState === 'interactive' ? 'is-ready' : ''} ${envelopeState === 'opening' ? 'is-opening' : ''}`} disabled={envelopeState !== 'interactive'} aria-label={TEXT_CONTENT.controls.openLetter} onClick={() => { sound.playEnvelopeOpen(); setEnvelopeState('opening'); }}>
          <span className="envelope-back" aria-hidden="true"/>
          <span className="envelope-paper" aria-hidden="true"><strong>{TEXT_CONTENT.intro.paperPreview}</strong><span>{TEXT_CONTENT.intro.paperNote}</span></span>
          <span className="envelope-front" aria-hidden="true"><svg viewBox="0 0 200 128"><path d="M0 40L87 91Q100 98 113 91L200 40V110Q200 128 182 128H18Q0 128 0 110Z" fill="#fff1d6"/><path d="M0 119L83 66Q100 54 117 66L200 119Q200 128 182 128H18Q0 128 0 119Z" fill="#f3dfbd"/></svg></span>
          <span className="envelope-lid" aria-hidden="true"><svg viewBox="0 0 200 128"><path d="M0 9Q0 0 18 0H182Q200 0 200 9L112 73Q100 82 88 73Z" fill="#fff7e5"/><circle cx="100" cy="74" r="17" fill="#dda0a5"/><Heart x={100} y={77} size={.48} color="#fff3e2"/></svg></span>
          <span className="envelope-label">{TEXT_CONTENT.intro.envelopeLabel}</span>
        </button>
      </div>
      <div className="bouquet-layer bouquet-front"><Bouquet front/></div>
      {envelopeState === 'tucked' && <button className="bouquet-trigger" aria-label={TEXT_CONTENT.controls.liftLetter} onClick={() => { sound.init(); sound.playCatch(1); setEnvelopeState(reducedMotion() ? 'interactive' : 'launching'); }}>{TEXT_CONTENT.controls.liftLetter}</button>}
    </div>
    <div className="intro-footer" aria-live="polite"><strong>{footer[0]}</strong><small>{footer[1]}</small></div>
    {envelopeState === 'opened' && <OpenLetterModal onStartGame={onStartGame} onClose={closeLetter}/>}
  </div>;
}



const RULES = GAME_CONFIG.gameplay;
const WIN_SCORE_TARGET = RULES.roundTarget;
const FINALE_SECONDS = RULES.finaleSeconds;
const FINALE_PAUSE = RULES.finalePause;
const ITEM_TYPES = [
  { id: 'sunflower', points: 15, color: '#edc575', weight: 35 },
  { id: 'star', points: 20, color: '#eac77e', weight: 25 },
  { id: 'heart', points: 10, color: '#dfa0ab', weight: 25 },
  { id: 'sparkle', points: 25, color: '#b3a4cc', weight: 15 },
  { id: 'cloud', points: 0, color: '#aab9c9', weight: 12 },
  { id: 'sickness', points: 0, color: '#a6b991', weight: 8 },
  { id: 'thorn', points: 0, color: '#bc9ba8', weight: 8 },
];

function readBestScore() {
  try { return Number(localStorage.getItem('smiley_highscore')) || 0; }
  catch { return 0; }
}

function fillRound(ctx, x, y, width, height, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, radius);
  ctx.fill();
}

function circle(ctx, x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
}

function drawHeart(ctx, x, y, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-30, -6, -15, -27, 0, -13);
  ctx.bezierCurveTo(15, -27, 30, -6, 0, 12); ctx.fill(); ctx.restore();
}

function drawHoodieCharacter(ctx, girl = false) {
  const hoodie = girl ? '#93465a' : '#a6a9b1';
  ctx.save();
  // Reuse the exact menu SVG paths so hairstyles stay identical in both renderers.
  ctx.fillStyle = '#393840';
  if (girl) ctx.fill(new Path2D(CHARACTER_HAIR.girlBack));
  fillRound(ctx, -20, 40, 16, 25, 7, '#777888');
  fillRound(ctx, 4, 40, 16, 25, 7, '#777888');
  fillRound(ctx, -27, 9, 54, 42, 19, hoodie);
  ctx.strokeStyle = hoodie; ctx.lineWidth = 15; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-19, 22); ctx.lineTo(-30, 38); ctx.moveTo(19, 22); ctx.lineTo(30, 38); ctx.stroke();
  circle(ctx, 0, -14, 29, '#f2cfb8');
  ctx.fillStyle = '#393840';
  ctx.fill(new Path2D(girl ? CHARACTER_HAIR.girlFront : CHARACTER_HAIR.boy));
  if (girl) { ctx.strokeStyle = '#53505b'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke(new Path2D('M7-40Q-5-27-23-23')); }
  ctx.fillStyle = '#e8a8a7';
  for (const x of [-17, 17]) { ctx.beginPath(); ctx.ellipse(x, -5, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#745c59'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-12, -9); ctx.quadraticCurveTo(-8, -15, -4, -9);
  ctx.moveTo(5, -9); ctx.quadraticCurveTo(9, -15, 13, -9);
  ctx.moveTo(-4, 0); ctx.quadraticCurveTo(0, 5, 4, 0); ctx.stroke();
  ctx.strokeStyle = '#eee4dc'; ctx.beginPath(); ctx.moveTo(-5, 21); ctx.lineTo(-5, 31); ctx.moveTo(5, 21); ctx.lineTo(5, 31); ctx.stroke();
  fillRound(ctx, -12, 35, 24, 10, 5, girl ? '#854154' : '#9599a3');
  ctx.restore();
}

function drawItem(ctx, item) {
  ctx.save(); ctx.translate(item.x, item.y); ctx.rotate(item.angle || 0);
  const id = item.id;
  if (id === 'girl') drawHoodieCharacter(ctx, true);
  else if (id === 'heart') drawHeart(ctx, 0, 3, .9, item.color);
  else if (id === 'sunflower') {
    for (let i = 0; i < 10; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 5); ctx.fillStyle = '#f5cb79';
      ctx.beginPath(); ctx.ellipse(0, -16, 6, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    circle(ctx, 0, 0, 13, '#b88761');
    circle(ctx, -4, -1, 1.5, '#745b50'); circle(ctx, 4, -1, 1.5, '#745b50');
    ctx.strokeStyle = '#745b50'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 2, 3, 0, Math.PI); ctx.stroke();
  } else if (id === 'star' || id === 'sparkle') {
    const count = id === 'star' ? 5 : 4;
    ctx.fillStyle = item.color; ctx.beginPath();
    for (let i = 0; i < count * 2; i++) {
      const a = i * Math.PI / count - Math.PI / 2, r = i % 2 ? 10 : 24;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  } else if (id === 'cloud') {
    fillRound(ctx, -25, -4, 50, 23, 12, item.color);
    circle(ctx, -11, -6, 12, item.color); circle(ctx, 6, -11, 16, item.color);
    circle(ctx, -7, 4, 1.8, '#788898'); circle(ctx, 8, 4, 1.8, '#788898');
    ctx.strokeStyle = '#91a9bf'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const x of [-12, 1, 14]) { ctx.beginPath(); ctx.moveTo(x, 24); ctx.lineTo(x - 3, 30); ctx.stroke(); }
  } else if (id === 'sickness') {
    ctx.strokeStyle = item.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.lineTo(Math.cos(a) * 24, Math.sin(a) * 24); ctx.stroke(); }
    circle(ctx, 0, 0, 17, item.color); circle(ctx, -5, -3, 3, '#cfdbb9'); circle(ctx, 6, 6, 4, '#cfdbb9');
  } else {
    ctx.strokeStyle = '#a1b29a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 23); ctx.quadraticCurveTo(15, 0, 0, -8); ctx.stroke();
    circle(ctx, -4, -10, 15, item.color); circle(ctx, 4, -8, 12, '#d3b3bd');
  }
  ctx.restore();
}

function drawMeadow(ctx, width, height) {
  ctx.fillStyle = '#fbf3e7'; ctx.fillRect(0, 0, width, height);
  circle(ctx, width * .82, height * .21, 48, '#f5dfaa');
  circle(ctx, width * .82 - 10, height * .21 - 2, 2.5, '#bc9c74');
  circle(ctx, width * .82 + 10, height * .21 - 2, 2.5, '#bc9c74');
  ctx.strokeStyle = '#bc9c74'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(width * .82, height * .21 + 6, 6, 0, Math.PI); ctx.stroke();
  ctx.fillStyle = '#e5ead4'; ctx.beginPath(); ctx.moveTo(0, height);
  ctx.lineTo(0, height - 140); ctx.quadraticCurveTo(width * .3, height - 260, width, height - 110); ctx.lineTo(width, height); ctx.fill();
  ctx.fillStyle = '#d5e2c8'; ctx.beginPath(); ctx.moveTo(0, height);
  ctx.lineTo(0, height - 90); ctx.quadraticCurveTo(width * .7, height - 200, width, height - 105); ctx.lineTo(width, height); ctx.fill();
  for (let i = 0; i < 14; i++) {
    const x = ((i * 173 + 45) % width), y = height - 18 - (i % 4) * 21;
    for (let j = 0; j < 5; j++) circle(ctx, x + Math.cos(j * Math.PI * .4) * 4, y + Math.sin(j * Math.PI * .4) * 4, 3.3, '#fff9e9');
    circle(ctx, x, y, 2.5, '#dec283');
  }
}

function drawSpeechBubble(ctx, bubble, width) {
  const progress = bubble.age / RULES.bubbleSeconds;
  ctx.save();
  // Fade in quickly, then drift upward and fade out over a 1.6-second lifetime.
  ctx.globalAlpha = Math.min(1, bubble.age / .12) * Math.min(1, (1 - progress) / .35);
  ctx.font = '600 12px Quicksand, sans-serif';
  const bubbleWidth = Math.min(width - 24, ctx.measureText(bubble.text).width + 30);
  const x = Math.max(12, Math.min(width - bubbleWidth - 12, bubble.x - bubbleWidth / 2));
  const y = bubble.y - progress * RULES.bubbleRise;
  fillRound(ctx, x, y, bubbleWidth, 36, 15, '#fffcf5');
  ctx.fillStyle = '#fffcf5'; ctx.beginPath(); ctx.moveTo(x + bubbleWidth / 2 - 6, y + 34);
  ctx.lineTo(x + bubbleWidth / 2, y + 43); ctx.lineTo(x + bubbleWidth / 2 + 6, y + 34); ctx.fill();
  ctx.fillStyle = '#a3687c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bubble.text, x + bubbleWidth / 2, y + 18, bubbleWidth - 20);
  ctx.restore();
}

function CatchingGame({ level = 1, initialScore = 0, onGameEnd, onBackToIntro, soundMuted, onToggleSound }) {
  const canvasRef = useRef(null);
  const stateRef = useRef(null);
  const endRef = useRef(onGameEnd);
  endRef.current = onGameEnd;
  const [hud, setHud] = useState({ score: initialScore, roundScore: 0, lives: RULES.lives, combo: 1, remaining: FINALE_SECONDS, finale: null, countdown: RULES.countdown });
  const [isPaused, setIsPaused] = useState(false);
  const pausedRef = useRef(false);
  const togglePause = () => { pausedRef.current = !pausedRef.current; setIsPaused(pausedRef.current); };

  useEffect(() => {
    const canvas = canvasRef.current, ctx = canvas.getContext('2d');
    // Each remount starts a round, preserving only the parent's total and level.
    // These multipliers affect speed, spawn frequency, and hazard probability.
    const difficultyMultiplier = 1 + (level - 1) * RULES.speedStepPerLevel;
    const hazardMultiplier = 1 + (level - 1) * RULES.hazardStepPerLevel;
    const state = {
      width: 0, height: 0, elapsed: 0, countdown: RULES.countdown, spawnTimer: .3,
      score: initialScore, startingScore: initialScore, level, difficultyMultiplier, hazardMultiplier, lives: RULES.lives, combo: 1, active: true, finale: null, finaleTimer: 0,
      items: [], particles: [], bubbles: [], damage: 0, keys: { left: false, right: false },
      player: { x: 0, targetX: 0, y: 0 },
      stats: { sunflowers: 0, stars: 0, hearts: 0, sparkles: 0, maxCombo: 1 },
    };
    stateRef.current = state;
    const publish = () => setHud({ score: state.score, roundScore: state.score - state.startingScore, lives: state.lives, combo: state.combo, remaining: Math.max(0, Math.ceil(FINALE_SECONDS - state.elapsed)), finale: state.finale, countdown: Math.max(0, Math.ceil(state.countdown)) });
    const resize = () => {
      // Physics stays in CSS pixels; only the backing buffer scales for Retina.
      const { width, height } = canvas.getBoundingClientRect();
      const previousWidth = state.width || width;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.player.x = state.width ? state.player.x / previousWidth * width : width / 2;
      state.player.targetX = state.player.x;
      state.width = width; state.height = height; state.player.y = height - 110;
      state.items.forEach(item => { item.x = item.id === 'girl' ? width / 2 : item.x / previousWidth * width; });
    };
    resize();
    const setKey = (e, pressed) => {
      if (['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'].includes(e.key)) {
        e.preventDefault(); state.keys[['ArrowLeft', 'a', 'A'].includes(e.key) ? 'left' : 'right'] = pressed;
      }
      if (pressed && !e.repeat && ['Escape', 'p', 'P'].includes(e.key)) togglePause();
    };
    const keyDown = e => setKey(e, true), keyUp = e => setKey(e, false);
    const blur = () => { state.keys.left = false; state.keys.right = false; if (state.active) { pausedRef.current = true; setIsPaused(true); } };
    const visibility = () => { if (document.hidden) blur(); };
    window.addEventListener('resize', resize); window.addEventListener('keydown', keyDown); window.addEventListener('keyup', keyUp);
    window.addEventListener('blur', blur); document.addEventListener('visibilitychange', visibility);
    // Terminal transition: active -> win/lose. Mark inactive BEFORE notifying
    // React so no later frame can score, finish twice, or emit another bubble.
    const finish = status => {
      if (!state.active) return;
      state.active = false;
      const isNewBest = state.score > readBestScore();
      if (isNewBest) { try { localStorage.setItem('smiley_highscore', String(state.score)); } catch { /* Private browsing may disable storage. */ } }
      if (status === 'win') sound.playVictory(); else sound.playDefeat();
      endRef.current({ status, level, finalScore: state.score, roundScore: state.score - state.startingScore, maxCombo: state.stats.maxCombo, stats: { ...state.stats }, isNewBest });
    };
    // Round state machine: normal (null) -> waiting -> falling -> win.
    // A missed girl loops falling -> waiting; losing all lives in normal -> lose.
    // Clear every normal item/effect atomically so hazards cannot hit in finale.
    const beginFinale = () => {
      if (state.finale) return;
      state.finale = 'waiting'; state.finaleTimer = 0;
      state.items = []; state.particles = []; state.bubbles = []; state.damage = 0; publish();
    };
    const spawnGirl = () => {
      state.finale = 'falling';
      // Use the highest possible ordinary speed in this round, plus 18%. The
      // final drop is always faster, even on tall screens or an early score win.
      state.items = [{ id: 'girl', x: state.width / 2, y: -75, angle: 0, speed: (RULES.baseSpeed + RULES.speedVariation + FINALE_SECONDS * RULES.speedPerSecond) * difficultyMultiplier * RULES.girlSpeedBoost }];
      publish();
    };
    const spawnItem = () => {
      // Positive weights stay fixed while hazards gain weight on every level.
      const itemWeight = item => item.weight * (item.points > 0 ? 1 : hazardMultiplier);
      let weight = Math.random() * ITEM_TYPES.reduce((sum, item) => sum + itemWeight(item), 0);
      const type = ITEM_TYPES.find(item => { weight -= itemWeight(item); return weight < 0; }) || ITEM_TYPES[0];
      state.items.push({ ...type, x: 35 + Math.random() * Math.max(1, state.width - 70), y: -35, speed: (RULES.baseSpeed + Math.random() * RULES.speedVariation + state.elapsed * RULES.speedPerSecond) * difficultyMultiplier, angle: 0, phase: Math.random() * Math.PI * 2 });
    };
    let animationId, lastTime = null, lastSecond = FINALE_SECONDS;
    const frame = now => {
      if (!state.active) return;
      // Seconds-based integration keeps spawn/bubble/fall timing consistent
      // across refresh rates. Cap large gaps so background throttling cannot
      // teleport items past the catcher on the next visible frame.
      const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, .05);
      lastTime = now;
      if (!pausedRef.current) {
        if (state.countdown > 0) {
          const previous = Math.ceil(state.countdown); state.countdown = Math.max(0, state.countdown - dt);
          if (previous !== Math.ceil(state.countdown)) publish();
        } else {
          const player = state.player;
          state.elapsed += dt; state.damage = Math.max(0, state.damage - dt);
          if (!state.finale && state.elapsed >= FINALE_SECONDS) beginFinale();
          if (state.finale === 'waiting') { state.finaleTimer += dt; if (state.finaleTimer >= FINALE_PAUSE) spawnGirl(); }
          if (state.keys.left || state.keys.right) player.targetX += ((state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0)) * 460 * dt;
          player.targetX = Math.max(38, Math.min(state.width - 38, player.targetX));
          player.x += (player.targetX - player.x) * (1 - Math.exp(-16 * dt));
          if (!state.finale) { state.spawnTimer -= dt; if (state.spawnTimer <= 0) { spawnItem(); state.spawnTimer = RULES.spawnInterval / difficultyMultiplier; } }
          for (let i = state.items.length - 1; i >= 0; i--) {
            const item = state.items[i], previousY = item.y;
            item.y += item.speed * dt;
            if (item.id !== 'girl') { item.x += Math.sin(state.elapsed * 2 + item.phase) * 16 * dt; item.angle = Math.sin(state.elapsed + item.phase) * .15; }
            // Swept vertical collision: test the segment from previousY to the
            // new Y against the basket band, not just the current point. This
            // catches fast items even if one frame crosses the entire band.
            // Horizontal tolerance is wider for the girl's larger silhouette.
            const catchY = player.y + 15;
            const inReach = Math.abs(item.x - player.x) < (item.id === 'girl' ? 54 : 43);
            if (inReach && item.y >= catchY - 25 && previousY <= catchY + 25) {
              if (item.id === 'girl') { state.items = []; finish('win'); return; }
              if (item.points > 0) {
                state.score += item.points * state.combo; state.combo = Math.min(8, state.combo + 1);
                state.stats.maxCombo = Math.max(state.stats.maxCombo, state.combo);
                state.stats[{ sunflower: 'sunflowers', star: 'stars', heart: 'hearts', sparkle: 'sparkles' }[item.id]]++;
                sound.playCatch(state.combo);
                // Only the first playthrough gets sweet messages. New bubbles
                // replace the oldest at the cap; simulation time handles their
                // fade, rise, pause, and removal without orphaned timeout calls.
                if (level === 1) {
                  const messages = TEXT_CONTENT.game.sweetMessages;
                  if (messages.length) {
                    state.bubbles.push({ text: messages[Math.floor(Math.random() * messages.length)], x: player.x, y: player.y - 100, age: 0 });
                    state.bubbles = state.bubbles.slice(-RULES.maxBubbles);
                  }
                }

                for (let j = 0; j < 9; j++) state.particles.push({ x: item.x, y: item.y, vx: (Math.random() - .5) * 120, vy: -30 - Math.random() * 90, life: .7, color: item.color });
                if (state.score - state.startingScore >= WIN_SCORE_TARGET) { beginFinale(); break; }
              } else {
                state.lives--; state.combo = 1; state.damage = .3; sound.playHurt();
                if (state.lives <= 0) { finish('lose'); return; }
              }
              state.items.splice(i, 1); publish();
            } else if (item.y > state.height + 80) {
              // Missing the finale retries the same drop, without adding
              // hazards or deducting lives/points.
              if (item.id === 'girl') { state.finale = 'waiting'; state.finaleTimer = 0; state.items = []; publish(); break; }
              if (item.points > 0 && state.combo > 1) { state.combo = 1; publish(); }
              state.items.splice(i, 1);
            }
          }
          state.bubbles = state.bubbles.filter(bubble => { bubble.age += dt; return bubble.age < RULES.bubbleSeconds; });
          state.particles = state.particles.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; return p.life > 0; });
          const second = Math.max(0, Math.ceil(FINALE_SECONDS - state.elapsed));
          if (second !== lastSecond) { lastSecond = second; publish(); }
        }
      }
      drawMeadow(ctx, state.width, state.height);
      state.items.forEach(item => drawItem(ctx, item));
      state.particles.forEach(p => { ctx.globalAlpha = p.life / .7; circle(ctx, p.x, p.y, 4, p.color); }); ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(state.player.x, state.player.y);
      ctx.fillStyle = '#a0b18d35'; ctx.beginPath(); ctx.ellipse(0, 66, 40, 8, 0, 0, Math.PI * 2); ctx.fill();
      drawHoodieCharacter(ctx);
      fillRound(ctx, -30, 27, 60, 24, 10, '#d2ae86');
      ctx.strokeStyle = '#e9c9a2'; ctx.lineWidth = 2;
      for (const y of [33, 41]) { ctx.beginPath(); ctx.moveTo(-25, y); ctx.lineTo(25, y); ctx.stroke(); }
      for (const x of [-18, -6, 6, 18]) { ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 47); ctx.stroke(); }
      ctx.restore();
      state.bubbles.forEach(bubble => drawSpeechBubble(ctx, bubble, state.width));
      if (state.damage > 0) { ctx.fillStyle = `rgba(218,151,161,${state.damage * .6})`; ctx.fillRect(0, 0, state.width, state.height); }
      animationId = requestAnimationFrame(frame);
    };
    animationId = requestAnimationFrame(frame);
    return () => {
      // One effect owns all animation/listeners. Remounting for a harder round
      // disposes the previous loop before the new state starts.
      state.active = false; cancelAnimationFrame(animationId);
      window.removeEventListener('resize', resize); window.removeEventListener('keydown', keyDown); window.removeEventListener('keyup', keyUp);
      window.removeEventListener('blur', blur); document.removeEventListener('visibilitychange', visibility);
    };
  }, []);

  const move = e => {
    if (!stateRef.current || pausedRef.current) return;
    const rect = canvasRef.current.getBoundingClientRect();
    stateRef.current.player.targetX = e.clientX - rect.left;
  };
  const backToIntro = () => onBackToIntro({ score: stateRef.current?.score ?? initialScore });
  const text = TEXT_CONTENT.game;
  const controls = TEXT_CONTENT.controls;
  return <div className="game-screen" onPointerMove={move} onPointerDown={e => { if (e.target === canvasRef.current) { e.currentTarget.setPointerCapture(e.pointerId); move(e); } }}>
    <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block' }} aria-label={text.canvasLabel}/>
    <div className="game-hud">
      <div className="hud-card"><div className="score-line" aria-label={formatText(text.totalScore, { score: hud.score })}><svg width="28" height="28" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="26" fill="#f5cb79"/><circle r="16" fill="#b88761"/></svg>{hud.score}<small>{formatText(text.levelProgress, { level, points: hud.roundScore, target: WIN_SCORE_TARGET })}<br/>{hud.finale ? text.lastCatch : formatText(text.remaining, { seconds: hud.remaining })}</small></div><div className="score-progress"><span style={{ width: `${Math.min(100, Math.max(hud.roundScore / WIN_SCORE_TARGET, (FINALE_SECONDS - hud.remaining) / FINALE_SECONDS) * 100)}%` }}/></div></div>
      <div className="hud-card hud-lives" aria-label={formatText(text.lives, { count: hud.lives })}>{Array.from({ length: RULES.lives }, (_, i) => <span key={i} style={{ opacity: i < hud.lives ? 1 : .2 }}><Icon name="heart"/></span>)}</div>
      <div className="game-actions"><button className="icon-button" onClick={togglePause} aria-label={isPaused ? controls.resume : controls.pause}><Icon name={isPaused ? 'play' : 'pause'}/></button><button className="icon-button" onClick={onToggleSound} aria-label={soundMuted ? controls.unmute : controls.mute}><Icon name={soundMuted ? 'muted' : 'sound'}/></button><button className="icon-button" onClick={backToIntro} aria-label={controls.returnToLetter}><Icon name="home"/></button></div>
    </div>
    {hud.finale && <div className="finale-message" role="status"><h2>{hud.finale === 'waiting' ? text.waitingTitle : text.fallingTitle}</h2><p>{hud.finale === 'waiting' ? text.waitingCopy : text.fallingCopy}</p></div>}
    <div className="game-guidance">{hud.combo > 1 && !hud.finale ? formatText(text.streak, { combo: hud.combo }) : ''}{text.controls}</div>
    {hud.countdown > 0 && !isPaused && <div className="game-overlay" role="status"><p className="eyebrow">{text.countdownTitle}</p><h2>{hud.countdown}</h2><p>{text.countdownCopy}</p></div>}
    {isPaused && <div className="game-overlay"><h2>{text.pauseTitle}</h2><p>{text.pauseCopy}</p><button className="primary-button" onClick={togglePause}>{text.resume}<Icon name="play" size={16}/></button><button className="secondary-button" onClick={backToIntro}>{text.back}</button></div>}
  </div>;
}



function GameOverModal({ status, level = 1, finalScore, maxCombo, stats, isNewBest, onPlayAgain, onBackToIntro }) {
  const isWin = status === 'win';
  const text = TEXT_CONTENT.result;
  useEffect(() => {
    if (isWin && window.confetti && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.confetti({ particleCount: 70, spread: 75, origin: { y: .6 }, colors: ['#e4acb3', '#f1d195', '#b7cdb1', '#c1b2d4'], disableForReducedMotion: true });
    }
  }, [isWin]);
  return <main className="result-screen">
    <section className="result-card" aria-labelledby="result-title">
      <p className="eyebrow">{isWin ? text.winEyebrow : text.loseEyebrow}</p>
      <svg className="result-art" viewBox="0 0 280 200" role="img" aria-label={isWin ? text.winArt : text.loseArt}>
        <ellipse cx="140" cy="104" rx="91" ry="83" fill={isWin ? '#f6e4df' : '#e9e9e3'}/>
        {isWin ? <>
          <ellipse cx="140" cy="183" rx="72" ry="8" fill="#dec9c330"/>
          {/* Separate, upright silhouettes: two happy people celebrating together. */}
          <Character x={94} y={116} size={.95}/><Character girl x={186} y={116} size={.95}/>
          <g fill="#e2bd7c"><circle cx="56" cy="44" r="4"/><circle cx="226" cy="64" r="3"/></g>
          <path d="M77 32l4 9M214 35l-4 9" stroke="#b8c8a9" strokeWidth="4" strokeLinecap="round"/>
          <Heart x={140} y={41} size={1.2}/><Heart x={67} y={79} size={.35} color="#e6bac1"/><Heart x={214} y={115} size={.4} color="#e6bac1"/>
        </> : <>
          <g fill="#b6c3cf"><rect x="83" y="65" width="114" height="45" rx="23"/><circle cx="111" cy="65" r="24"/><circle cx="151" cy="56" r="31"/></g>
          <path d="M113 88q5-6 10 0M154 88q5-6 10 0" stroke="#8393a4" fill="none" strokeWidth="3" strokeLinecap="round"/>
          <path d="M108 120l-4 10M140 119l-4 10M173 120l-4 10" stroke="#a8bfd0" strokeWidth="5" strokeLinecap="round"/>
          <path d="M140 184V164" stroke="#9fb293" strokeWidth="6" strokeLinecap="round"/><Flower x={140} y={160} size={.45}/>
        </>}
      </svg>
      <h1 id="result-title" role="status">{isWin ? text.winTitle : text.loseTitle}</h1>
      <p className="result-copy">{isWin ? text.winCopy : text.loseCopy}</p>
      {isNewBest && <span className="best-badge">{text.best}</span>}
      <div className="result-score"><small>{text.total}</small><strong>{finalScore}</strong><small>{formatText(text.streak, { level, combo: maxCombo })}</small></div>
      <div className="result-stats"><span>{formatText(text.flowers, { count: stats.sunflowers || 0 })}</span><span>{formatText(text.stars, { count: stats.stars || 0 })}</span><span>{formatText(text.hearts, { count: stats.hearts || 0 })}</span><span>{formatText(text.sparkles, { count: stats.sparkles || 0 })}</span></div>
      <button className="primary-button" onClick={onPlayAgain}>{formatText(text.playAgain, { level: level + 1 })} <span aria-hidden="true">{TEXT_CONTENT.symbols.arrow}</span></button>
      <button className="secondary-button" onClick={onBackToIntro}>{text.back}</button>
    </section>
  </main>;
}



function App() {
  // App owns the session across canvas remounts. Only the round's temporary
  // state (lives, timer, items, streak) belongs inside CatchingGame.
  const [view, setView] = useState('intro');
  const [soundMuted, setSoundMuted] = useState(false);
  const [session, setSession] = useState({ score: 0, level: 0 });
  const [gameKey, setGameKey] = useState(0);
  const [gameOverData, setGameOverData] = useState(null);

  React.useEffect(() => { document.title = TEXT_CONTENT.appTitle; }, []);

  const handleToggleSound = () => {
    setSoundMuted(sound.toggleMute());
  };

  // Every new round advances the level, including a round started from the
  // letter after returning to the intro. Level 1 can therefore happen only once
  // in this session; refreshing the page begins a new session.
  const startRound = () => {
    sound.init();
    setSession(previous => ({ ...previous, level: previous.level + 1 }));
    setGameKey(key => key + 1);
    setView('game');
  };

  const handleGameEnd = data => {
    // Preserve accumulated points on BOTH victory and defeat. The next round
    // earns another 500 points toward its own climax, rather than reusing the
    // accumulated total as an immediately satisfied win condition.
    setSession(previous => ({ ...previous, score: data.finalScore }));
    setGameOverData(data);
    setView('end');
  };

  const handleBackToIntro = snapshot => {
    // Leaving an unfinished round carries its earned points too. Result-screen
    // buttons supply no snapshot because handleGameEnd already saved the total.
    if (typeof snapshot?.score === 'number') {
      setSession(previous => ({ ...previous, score: snapshot.score }));
    }
    setView('intro');
  };

  return <div className="app-shell">
    <style>{introStyles}</style>
    {view === 'intro' && <IntroScreen onStartGame={startRound} soundMuted={soundMuted} onToggleSound={handleToggleSound}/>}
    {view === 'game' && <CatchingGame key={gameKey} level={session.level} initialScore={session.score} onGameEnd={handleGameEnd} onBackToIntro={handleBackToIntro} soundMuted={soundMuted} onToggleSound={handleToggleSound}/>}
    {view === 'end' && <GameOverModal {...gameOverData} level={session.level} onPlayAgain={startRound} onBackToIntro={() => handleBackToIntro()}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
